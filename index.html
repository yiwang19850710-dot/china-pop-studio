<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>China Pop Studio</title>
    <link rel="stylesheet" href="styles.css?v=3" />
    <link rel="stylesheet" href="mobile-upgrades.css?v=3" />
    <link rel="stylesheet" href="recording-upgrades.css?v=1" />
  </head>
  <body>
    <main class="app-shell">
      <section class="studio">
        <header class="topbar">
          <div>
            <p class="eyebrow">Photo and video booth</p>
            <h1>China Pop Studio</h1>
          </div>
          <div class="status" id="status">Camera is off</div>
        </header>

        <div class="stage-wrap">
          <canvas id="stage" width="720" height="1280" aria-label="Camera preview"></canvas>
          <video id="camera" playsinline muted></video>
          <div class="recording-indicator" id="recordingIndicator" hidden>
            <span></span>
            <b>Recording</b>
            <em id="recordingCountdown">0s</em>
          </div>
        </div>

        <div class="action-row">
          <button class="primary" id="startCamera" type="button">Start camera</button>
          <label class="inline-toggle">
            <input id="cutoutToggle" type="checkbox" />
            Cut out background
          </label>
          <button id="capturePhoto" type="button" disabled>Capture photo</button>
          <button id="recordVideo" type="button" disabled>Record video</button>
          <a class="download" id="downloadLink" hidden>Download</a>
        </div>
      </section>

      <aside class="controls" aria-label="Studio controls">
        <section>
          <h2>Templates</h2>
          <div class="template-grid" id="templates"></div>
        </section>

        <section class="template-admin" id="templateAdmin" hidden>
          <button class="manager-toggle" id="templateManagerToggle" type="button">
            Template manager / 模板管理
          </button>

          <div class="manager-panel" id="templateManagerPanel" hidden>
            <div class="media-generator">
              <label>
                Upload template image/video
                <input id="managerMediaUpload" accept="image/*,video/*" type="file" />
              </label>
              <button id="managerGenerateFromMedia" type="button">Generate template</button>
              <p id="managerMediaStatus">Upload a China-scene image or short video, then generate a draft template.</p>
            </div>

            <label>
              Editing template
              <select id="managerTemplate"></select>
            </label>

            <label>
              Template name
              <input id="managerName" type="text" />
            </label>

            <label>
              Category
              <input id="managerCategory" type="text" />
            </label>

            <label>
              Chinese headline
              <input id="managerTitleZh" type="text" />
            </label>

            <label>
              English headline
              <input id="managerTitleEn" type="text" />
            </label>

            <label>
              Chinese subtitle
              <input id="managerSubZh" type="text" />
            </label>

            <label>
              English subtitle
              <input id="managerSubEn" type="text" />
            </label>

            <label>
              Seal / 印章文字
              <input id="managerSeal" maxlength="2" type="text" />
            </label>

            <div class="manager-sliders">
              <label>
                Camera X / 摄像头左右 <span id="managerSlotXValue">50%</span>
                <input id="managerSlotX" min="5" max="95" type="range" />
              </label>

              <label>
                Camera Y / 摄像头上下 <span id="managerSlotYValue">44%</span>
                <input id="managerSlotY" min="5" max="95" type="range" />
              </label>

              <label>
                Camera size / 摄像头大小 <span id="managerSlotScaleValue">76%</span>
                <input id="managerSlotScale" min="35" max="150" type="range" />
              </label>
            </div>

            <label>
              Camera shape / 摄像头形状
              <select id="managerSlotShape">
                <option value="oval">Oval portrait</option>
                <option value="circle">Round badge</option>
                <option value="arch">Palace arch</option>
                <option value="full">Full camera layer</option>
              </select>
            </label>

            <div class="manager-actions">
              <button id="managerApply" type="button">Apply</button>
              <button id="managerReset" type="button">Reset</button>
              <button id="managerExport" type="button">Export JSON</button>
              <button id="managerImport" type="button">Import JSON</button>
            </div>

            <label>
              Template JSON
              <textarea id="managerJson" spellcheck="false"></textarea>
            </label>
          </div>
        </section>

        <section class="panel-grid">
          <label>
            Output frame
            <select id="outputFrame">
              <option value="story">Story 9:16</option>
              <option value="wide">Wide 16:9</option>
            </select>
          </label>

          <label>
            Portrait shape
            <select id="maskStyle">
              <option value="oval">Oval portrait</option>
              <option value="circle">Round badge</option>
              <option value="arch">Palace arch</option>
              <option value="full">Full camera layer</option>
            </select>
          </label>

          <label>
            Record length
            <select id="recordLength">
              <option value="5">5 seconds</option>
              <option value="10">10 seconds</option>
              <option value="15">15 seconds</option>
            </select>
          </label>

          <label>
            Portrait size
            <input id="portraitSize" min="55" max="105" value="78" type="range" />
          </label>

          <label>
            Foreground intensity
            <input id="fxIntensity" min="0" max="100" value="72" type="range" />
          </label>
        </section>

        <section class="toggles">
          <label><input id="mirrorToggle" type="checkbox" checked /> Mirror camera</label>
          <label><input id="countdownToggle" type="checkbox" /> Countdown</label>
        </section>

        <section class="output-panel" id="outputPanel" hidden>
          <h2>Latest output</h2>
          <img id="photoPreview" alt="Latest captured photo" hidden />
          <video id="videoPreview" controls hidden></video>
        </section>
      </aside>
    </main>

    <script src="templates.js"></script>
    <script src="app.js?v=3"></script>
    <script src="portrait-segmentation.js?v=5"></script>
    <script src="studio-upgrades.js?v=4"></script>
    <script src="recording-upgrades.js?v=2"></script>
    <script src="published-loader.js?v=1"></script>
    <script src="admin-loader.js?v=3"></script>
  </body>
</html>
